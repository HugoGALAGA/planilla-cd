name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests con coverage (gate 80%)
        run: |
          uv run pytest --cov=src/planilla --cov-report=term-missing --cov-report=html --cov-fail-under=80

      - name: Subir reporte HTML de coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html
          path: htmlcov/